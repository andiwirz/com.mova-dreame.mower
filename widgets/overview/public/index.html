<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Mäher Totalübersicht</title><body><header><div><h1 id="name">Mäher Totalübersicht</h1><small id="status">Lade Status …</small></div><span class="badge" id="battery">—</span></header><section id="garageSection" hidden><div class="title">Garagentor</div><div class="door" id="door">Endlage unbestätigt</div><div class="meta muted"><span id="sensor">Sensor: —</span><span id="safety">Sicherheit: —</span></div><div class="grid"><button data-action="gate_open">Tor AUF</button><button data-action="gate_close">Tor ZU</button></div><div class="note" id="garageNote"></div></section><section><div class="title">Livekamera</div><div class="screen" id="cameraScreen"><span id="placeholder">Aus</span><canvas id="live" aria-label="Livebild des Mähers" hidden></canvas></div><div class="bar"><span id="cameraState">Aus</span><div class="camera-actions"><button class="primary" id="cameraToggle">Kamera EIN</button></div></div><div class="note">Video nur bei Bedarf</div><div class="camera-error" role="status" id="cameraError"></div></section><section><div class="title">Mähkarte · Hell / Dunkel</div><div id="mapStatic" class="map-static" role="img" aria-label="Mähkarte"><div class="map-loading">Karte wird geladen …</div></div><div id="overviewMapInline" class="map-editor-inline" hidden></div><div id="overviewMapFooter" class="overview-map-footer"><span id="overviewMapMeta">Map</span><span class="overview-map-actions"><button id="overviewMapEdit" class="overview-map-action" type="button" aria-controls="overviewMapInline">Edit</button><button id="overviewMapRefresh" class="overview-map-refresh" type="button" title="Karte aktualisieren">↻</button></span></div></section><section><div class="title">Mäher steuern</div><div class="grid"><button data-action="mow">Mähen</button><button data-action="spot">Spotmähen</button><button data-action="pause">Pause / Weiter</button><button data-action="stop">Mäher STOP</button><button data-action="return">Rückkehr</button><button data-action="maintenance">Wartungspunkt</button></div><div class="action-status" id="actionStatus" aria-live="polite"></div><div class="note">Spotmähen verwendet den im Mäher ausgewählten Spot.</div></section><div class="error" role="status" id="error"></div><script src="dashboard.js"></script></body></html>
