

<style>
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--homey-background-color,#f5f5f7); color:var(--homey-text-color,#1a1a1a); }
    body { padding:24px 18px 32px; }
    .wrap { max-width:540px; margin:0 auto; }
    h1 { margin:0 0 8px; font-size:24px; }
    .lead { opacity:.66; line-height:1.45; margin:0 0 22px; }
    .card { width:100%; border:0; border-radius:16px; padding:18px; margin:0 0 14px; text-align:left; background:rgba(127,127,127,.10); color:inherit; box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer; }
    .card:active { transform:scale(.992); }
    .title { font-size:18px; font-weight:700; display:flex; align-items:center; gap:10px; }
    .desc { display:block; margin-top:7px; font-size:13px; line-height:1.45; opacity:.62; }
    .badge { display:inline-flex; align-items:center; padding:4px 8px; border-radius:999px; margin-top:10px; font-size:11px; font-weight:700; background:rgba(39,117,76,.15); color:#27754c; }
  </style>
<div class="wrap">
  <div id="repair-language-choice" role="group" aria-label="Language / Sprache" style="display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:0 0 10px;font-size:12px;opacity:.88">
    <span id="repair-language-label">Sprache</span>
    <button id="repair-language-de" type="button" aria-pressed="false" style="border:1px solid #999;border-radius:6px;padding:6px 10px;background:transparent;color:inherit">DE</button>
    <button id="repair-language-en" type="button" aria-pressed="false" style="border:1px solid #999;border-radius:6px;padding:6px 10px;background:transparent;color:inherit">EN</button>
  </div>

  <h1 id="headline">Mähroboter verwalten</h1>
  <p id="lead" class="lead">Mähkarte bearbeiten, Garagensteuerung konfigurieren oder Cloud-Verbindung reparieren. Wartungspunkte bleiben unabhängig vom Garagenmodus verwaltbar.</p>

  <button class="card" onclick="Homey.showView('map_editor')">
    <span class="title">🗺️ <span id="map-title">Mähkarte bearbeiten</span></span>
    <span class="desc" id="map-desc">Zum Bearbeiten zuerst „Bearbeiten“ wählen. Dann Marker, Sperrzonen oder Wartungspunkte antippen; native Wartungspunkt-Positionen bleiben unverändert.</span>
    <span class="badge" id="map-badge">Ohne Widget nutzbar</span>
  </button>

  <button class="card" id="maintenance-config" onclick="Homey.showView('maintenance_settings')">
    <span class="title">📍 <span id="maintenance-title">Wartungspunkte</span></span>
    <span class="desc" id="maintenance-desc">P1–P5 anzeigen, benennen und Hauptpunkt zuweisen. Unabhängig vom Garagenmodus.</span>
  </button>
  <button class="card" id="garage-config" hidden onclick="Homey.showView('garage_settings')">
    <span class="title">🏠 <span id="garage-title">Garagenmodus</span></span>
    <span class="desc" id="garage-desc">Tor, Sensor, Sicherheitsabstände, Karteneinblendungen und automatischen Punktwechsel konfigurieren.</span>
  </button>

  <button class="card" onclick="Homey.showView('reauth')">
    <span class="title">🔐 <span id="auth-title">Verbindung neu anmelden</span></span>
    <span class="desc" id="auth-desc">MOVA-/Dreame-Zugangsdaten erneut anmelden, falls die Cloud-Verbindung abgelaufen ist.</span>
  </button>
  <p id="ui-build" class="desc" style="text-align:right;margin:8px 2px 0">UI 1.2.0 · 02.11.2026</p>
  <button id="finish-repair" class="card" type="button" onclick="Homey.done()" style="font-weight:700;text-align:center" >Fertig</button>
</div>
<script>
  (function(){
    // Start in the best available local language, then adopt Homey's own locale.
    // The embedded iOS WebView can report English while Homey is set to German.
    const fallback=(typeof Homey.getLanguage==='function' && Homey.getLanguage()) ||
      (typeof navigator!=='undefined'?navigator.language:'en') || 'en';
    const texts={
      'headline':['Manage mower','Mäher verwalten'],
      'lead':['Manage maintenance points even without Garage Mode, edit the map, configure garage safety or reconnect your account.','Wartungspunkte unabhängig vom Garagenmodus verwalten, Karte bearbeiten, Garagensicherheit einstellen oder das Konto erneut verbinden.'],
      'map-title':['Edit mowing map','Mähkarte bearbeiten'],
      'map-desc':['Select Edit first. Then tap markers, no-go zones or maintenance points; native waypoint positions remain unchanged.','Zum Bearbeiten zuerst „Bearbeiten“ wählen. Dann Marker, Sperrzonen oder Wartungspunkte antippen; native Wartungspunkt-Positionen bleiben unverändert.'],
      'map-badge':['Works without a widget','Ohne Widget nutzbar'],
      'maintenance-title':['Maintenance points','Wartungspunkte'],
      'maintenance-desc':['View, name and select primary point P1–P5 even when Garage Mode is off.','P1–P5 anzeigen, benennen und Hauptpunkt zuweisen – auch ohne Garagenmodus.'],
      'garage-title':['Garage Mode','Garagenmodus'],
      'garage-desc':['Configure door, sensor, safety distances, map overlays and automatic point rotation.','Tor, Sensor, Sicherheitsabstände, Karteneinblendungen und automatischen Wartungspunktwechsel einstellen.'],
      'auth-title':['Reconnect account','Verbindung neu anmelden'],
      'auth-desc':['Sign in to MOVA/Dreame again if the cloud session has expired.','MOVA-/Dreame-Zugangsdaten erneut anmelden, falls die Cloud-Verbindung abgelaufen ist.'],
      'finish-repair':['Done – close management','Fertig – Verwaltung schließen'],
      'repair-language-label':['Language','Sprache']
    };
    const hostDocumentLanguage=document.documentElement?.lang||null;
    function preferredLanguage(serverLanguage){
      let override=null;
      try{override=localStorage.getItem('mova.repair.uiLanguage')}catch(_){}
      const homeyLanguage=(typeof Homey.getLanguage==='function'&&Homey.getLanguage())||null;
      const documentLanguage=hostDocumentLanguage;
      return override||homeyLanguage||serverLanguage||documentLanguage||fallback;
    }
    function setUserLanguage(locale){
      try{localStorage.setItem('mova.repair.uiLanguage',locale)}catch(_){}
      try{const result=Homey.emit('set_repair_ui_language',{language:locale});if(result?.catch)result.catch(()=>{});}catch(_){}
      applyLanguage(locale);
    }
    document.getElementById('repair-language-de').addEventListener('click',()=>setUserLanguage('de'));
    document.getElementById('repair-language-en').addEventListener('click',()=>setUserLanguage('en'));
    function applyLanguage(language){
      const de=/^de(?:[-_]|$)/i.test(String(language||'en'));
      if (!document.getElementById('headline')) return;
      if(document.documentElement) document.documentElement.lang=de?'de':'en';
      for(const locale of ['de','en']){const button=document.getElementById('repair-language-'+locale); if(button)button.setAttribute('aria-pressed',String((de?'de':'en')===locale));}
      for(const [id,pair] of Object.entries(texts)){
        const element=document.getElementById(id);if(element)element.textContent=pair[de?1:0];
      }
      try{Homey.setTitle(de?'Mäher verwalten':'Manage mower');document.getElementById('headline').hidden=true}catch(_){}
    }
    applyLanguage(preferredLanguage(null));
    try{
      let accepted=false;
      const received=(error, language)=>{
        if(accepted||error||typeof language!=='string')return;
        accepted=true;applyLanguage(preferredLanguage(language));
      };
      const result=Homey.emit('get_repair_ui_language',{},received);
      if(result && typeof result.then==='function')result.then(lang=>received(null,lang),()=>{});
    }catch(_){}
    // Maintenance remains usable without Garage Mode. Do not change the
    // visibility when the independent point-config request fails.
    try { Homey.emit('get_maintenance_point_config',{},function(error,config){
      if(!error && config && document.getElementById('garage-config'))
        document.getElementById('garage-config').hidden=!config.garageEnabled;
    }); }catch(_){}
    try{Homey.ready?.()}catch(_){}
  })();
</script>
