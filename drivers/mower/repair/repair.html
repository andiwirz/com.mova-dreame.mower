

<style>
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--homey-background-color,#f5f5f7); color:var(--homey-text-color,#1a1a1a); }
    body { padding:24px 18px 32px; }
    .wrap { max-width:540px; margin:0 auto; }
    h1 { margin:0 0 8px; font-size:24px; }
    .lead { opacity:.66; line-height:1.45; margin:0 0 22px; }
    .card { width:100%; border:0; border-radius:16px; padding:18px; margin:0 0 14px; text-align:left; background:rgba(127,127,127,.10); color:inherit; box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer; }
    .card:active { transform:scale(.992); }
    .title { font-size:18px; font-weight:700; display:flex; align-items:center; gap:10px; }
    .desc { display:block; margin-top:7px; font-size:13px; line-height:1.45; opacity:.62; }
    .badge { display:inline-flex; align-items:center; padding:4px 8px; border-radius:999px; margin-top:10px; font-size:11px; font-weight:700; background:rgba(39,117,76,.15); color:#27754c; }
  </style>
<div class="wrap">
  <h1 id="headline">Mähroboter verwalten</h1>
  <p id="lead" class="lead">Karte bearbeiten oder die Cloud-Verbindung reparieren. Das Karten-Widget ist dafür nicht erforderlich.</p>

  <button class="card" onclick="Homey.showView('map_editor')">
    <span class="title">🗺️ <span id="map-title">Mähkarte bearbeiten</span></span>
    <span class="desc" id="map-desc">Sicherheitslinie A/B, Gefahrenbereich, Wartungspunkt und Kartenhinweise direkt am Gerät bearbeiten.</span>
    <span class="badge" id="map-badge">Ohne Widget nutzbar</span>
  </button>

  <button class="card" onclick="Homey.showView('reauth')">
    <span class="title">🔐 <span id="auth-title">Verbindung neu anmelden</span></span>
    <span class="desc" id="auth-desc">MOVA-/Dreame-Zugangsdaten erneut anmelden, falls die Cloud-Verbindung abgelaufen ist.</span>
  </button>
</div>
<script>
  (function(){
    const de = (navigator.language || '').toLowerCase().startsWith('de');
    try { Homey.setTitle(de ? 'Mähkarte & Verbindung' : 'Map & Connection'); } catch(e) {}
    if (!de) {
      document.getElementById('headline').textContent = 'Manage mower';
      document.getElementById('lead').textContent = 'Edit the map or repair the cloud connection. No dashboard widget is required.';
      document.getElementById('map-title').textContent = 'Edit mowing map';
      document.getElementById('map-desc').textContent = 'Edit safety line A/B, danger area, maintenance point and map annotations directly for this device.';
      document.getElementById('map-badge').textContent = 'Works without a widget';
      document.getElementById('auth-title').textContent = 'Reconnect account';
      document.getElementById('auth-desc').textContent = 'Sign in to MOVA/Dreame again if the cloud session has expired.';
    }
  })();
  try { if (Homey.ready) Homey.ready(); } catch (e) {}
</script>
