

<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: auto; }
    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #map-wrap {
      flex: 1;
      touch-action: auto;
      width: 100%;
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }
    #map-wrap svg { width: 100%; min-width: 100%; height: 100%; display: block; touch-action: auto; }
    #footer {
      font-size: 10px;
      color: var(--homey-text-color, rgba(255,255,255,0.45));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 3px 6px;
      white-space: nowrap;
      overflow: hidden;
    }
    #footer-text {
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    #refresh-btn {
      background: none;
      border: none;
      color: var(--homey-text-color, rgba(255,255,255,0.45));
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 2px 4px;
      flex-shrink: 0;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    #refresh-btn:hover { opacity: 1; }
    #footer-actions { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .map-action { border:0; border-radius:7px; padding:3px 7px; font-size:10px; cursor:pointer; background:rgba(255,255,255,0.12); color:var(--homey-text-color,#fff); }
    .map-action.primary { background:rgba(76,175,80,0.82); color:#fff; }
    .map-action.danger { background:rgba(255,255,255,0.10); }
    .map-action:disabled { opacity:0.45; cursor:default; }
    #edit-actions { display:none; gap:4px; }
    #edit-actions.active { display:flex; }
    #edit-btn.hidden { display:none; }
    .edit-hint { opacity:.72; }
    #map-wrap.editing, #map-wrap.editing svg { touch-action:none; }
    svg.editing { touch-action:none; }
    svg.editing [data-edit-marker] { cursor:grab; touch-action:none; }
    svg.editing [data-edit-marker].dragging { cursor:grabbing; }
    #refresh-btn.loading { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg {
      color: var(--homey-text-color, rgba(255,255,255,0.5));
      font-size: 12px;
      text-align: center;
      padding: 8px;
      line-height: 1.4;
    }
    .msg.err { color: #e74c3c; }

    #pylon-editor { display:none; position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.48); align-items:flex-end; justify-content:center; }
    #pylon-editor.active { display:flex; }
    #pylon-card { box-sizing:border-box; width:min(520px,100%); max-width:100vw; max-height:calc(100dvh - 24px); overflow-y:auto; background:#202124; color:#f5f5f5; border:1px solid rgba(255,255,255,.10); border-radius:12px 12px 0 0; padding:14px 14px max(18px,env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,.35); }
    #pylon-card h3 { font-size:15px; margin-bottom:8px; }
    .pylon-row { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:12px; }
    .pylon-row label { min-width:90px; opacity:.75; }
    .pylon-row select,.pylon-row input { box-sizing:border-box; min-width:0; flex:1; border:1px solid rgba(255,255,255,.10); border-radius:5px; padding:7px 8px; background:#3a3b3e; color:#fff; }
    .pylon-meta { font-size:10px; opacity:.62; line-height:1.35; margin:6px 0 10px; word-break:break-word; }
    .pylon-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .pylon-actions button { min-width:0; min-height:42px; white-space:normal; border:0; border-radius:4px; padding:8px; font-size:12px; background:#e7e7e7; color:#202124; }
    .pylon-actions button:disabled { opacity:1; background:#36383a !important; color:#76797c !important; cursor:default; }

    .pylon-actions .hold { grid-column:1 / -1; background:#3b3d40; color:#fff; }
    #pylon-remove:not(:disabled) { background:#67312e; color:#ffc0bb; }
    #pylon-delete-zone:not(:disabled) { background:#ff6b61; color:#171717; font-weight:700; }
    #pylon-cancel:not(:disabled) { background:#e7e7e7; color:#202124; }
    #pylon-save:not(:disabled) { background:#278a50; color:#fff; font-weight:600; }
    #pylon-feedback { min-height:1.4em; font-size:12px; line-height:1.35; margin:6px 0; }
    #pylon-feedback.error { color:#ff8a80; }
    svg.editing [data-pylon-id] { cursor:pointer; touch-action:none; pointer-events:all; }
    svg.editing [data-native-zone-id] { cursor:pointer; touch-action:none; pointer-events:all; }
    .pylon-pending-ring { fill:none; stroke:#42a5f5; stroke-width:4; stroke-dasharray:12 7; stroke-linecap:round; vector-effect:non-scaling-stroke; animation:pylon-pending-dash .75s linear infinite,pylon-pending-pulse 1.4s ease-in-out infinite; pointer-events:none; }
    .pylon-pending-zone { fill:rgba(66,165,245,.14); stroke:#42a5f5; stroke-width:4; stroke-dasharray:12 7; stroke-linecap:round; vector-effect:non-scaling-stroke; animation:pylon-pending-dash .75s linear infinite,pylon-pending-pulse 1.4s ease-in-out infinite; pointer-events:none; }
    @keyframes pylon-pending-dash { to { stroke-dashoffset:-32; } }
    @keyframes pylon-pending-pulse { 50% { opacity:.45; } }

<div id="map-wrap"><div class="msg">Loading map…</div></div>
  <div class="msg" id="editor-help">Marker mit „Edit“ verschieben; Änderungen mit „Save“ speichern. Das Dashboard-Widget ist nicht erforderlich.</div>
  <div id="footer">
    <span id="footer-text"></span>
    <span id="footer-actions">
      <button id="edit-btn" class="map-action" title="Edit markers / Marker bearbeiten">Edit</button>
      <span id="edit-actions">
        <button id="cancel-edit-btn" class="map-action danger">Cancel</button>
        <button id="save-edit-btn" class="map-action primary">Save</button>
      </span>
      <button id="refresh-btn" title="Refresh map / Karte aktualisieren">↻</button>
    </span>
  </div>

  <div id="pylon-editor">
    <div id="pylon-card">
      <h3>Pylon / Problemstelle</h3>
      <div class="pylon-meta" id="pylon-meta"></div>
      <div class="pylon-row"><label>Radius</label><input id="pylon-radius" type="number" min="50" max="300" step="1" value="50"><span>cm</span></div>
      <div class="pylon-row"><label>Aktiv / Active</label><select id="pylon-lifecycle">
        <option value="permanent">Dauerhaft / Permanent</option>
        <option value="days_3">3 Tage / 3 days</option>
        <option value="days_7">7 Tage / 7 days</option>
        <option value="days_14">14 Tage / 14 days</option>
        <option value="departure">Nur Ausfahrt / Departure only</option>
        <option value="departure_mowing">Ausfahrt + Mähen / Departure + mowing</option>
        <option value="mowing">Nur Mähen / Mowing only</option>
        <option value="mowing_return">Mähen + Rückkehr / Mowing + return</option>
        <option value="return">Nur Rückkehr / Return only</option>
      </select></div>
      <div class="pylon-row"><label>Name / Notiz</label><input id="pylon-note" type="text" maxlength="120"></div>
      <div class="pylon-meta" id="pylon-zone-status"></div>
      <div id="pylon-feedback" role="status" aria-live="polite"></div>
      <div class="pylon-actions"><button id="pylon-reload" class="reload">Karte neu laden / prüfen</button><button id="pylon-hold" class="hold" hidden>Offen halten</button><button id="pylon-remove" class="remove">Markierung ausblenden</button><button id="pylon-delete-zone" class="remove">Sperrzone löschen</button><button id="pylon-cancel">Abbrechen</button><button id="pylon-save">Sperrzone speichern</button></div>
    </div>
  </div>

  <script>
    'use strict';

    var _homey = null;
    var _settings = { show_zones: true, show_forbidden: true, show_spots: true, show_robot: true, show_obstacles: true, show_garage_overlay: true, show_path: true, show_direction: true, show_maintenance_point: true };
    var _lastData = null;
    var _lastFullMapData = null;
    var _lastPylonUiRevision = -1;
    var _lastVbW = 0, _lastVbH = 0;
    var _stableWidgetWidth = 0;
    var _stableWidgetHeight = 0;
    var _editMode = false;
    var _editDraft = null;
    var _dragMarker = null;
    var _deviceId = null;
    var _initialGeometryWaits = 0;
    var _selectedPylon = null;
    var _pylonSaving = false;
    var _pylonReloadDone = false;
    var _pylonCloseTimer = null;
    var _pylonCloseRemaining = 0;

    function showMsg(text, isErr) {
      document.getElementById('map-wrap').innerHTML =
        '<div class="msg' + (isErr ? ' err' : '') + '">' + text + '</div>';
    }

    function hasFullGardenGeometry(data) {
      return !!(data && data.boundary && Array.isArray(data.mowingAreas) && data.mowingAreas.length > 0);
    }

    function mergeLiveMapData(base, incoming) {
      if (!base) return incoming;
      if (!incoming) return base;
      var merged = Object.assign({}, base, incoming);
      // Never replace a known complete garden with a temporary telemetry/fallback
      // response. Such responses caused the mobile widget to jump to a tiny crop.
      merged.boundary = base.boundary;
      merged.mowingAreas = base.mowingAreas;
      merged.forbiddenAreas = Array.isArray(base.forbiddenAreas) ? base.forbiddenAreas : [];
      merged.spotAreas = Array.isArray(base.spotAreas) ? base.spotAreas : [];
      merged.contours = Array.isArray(base.contours) ? base.contours : [];
      merged.mapObstacles = Array.isArray(base.mapObstacles) ? base.mapObstacles : [];
      merged.livePath = Array.isArray(incoming.livePath) && incoming.livePath.length ? incoming.livePath : base.livePath;
      return merged;
    }

    function onMapData(data) {
      // Backend bumps this revision when native pylon verification state changes.
      // Drop the widget's in-page full-map cache once so the next payload is
      // handled like a clean reopen instead of being merged with stale geometry.
      var incomingPylonRevision = data && Number.isFinite(Number(data.pylonUiRevision))
        ? Number(data.pylonUiRevision) : 0;
      if (_lastPylonUiRevision >= 0 && incomingPylonRevision !== _lastPylonUiRevision) {
        _lastData = null;
        _lastFullMapData = null;
        _initialGeometryWaits = 0;
      }
      _lastPylonUiRevision = incomingPylonRevision;
      // Never establish the initial viewport from telemetry/fallback or a partial
      // one-zone payload. That transient payload caused the sporadic garage close-up.
      if (!_lastFullMapData && data && (data.mapFallbackReason || !hasFullGardenGeometry(data))) {
        _initialGeometryWaits++;
        // Server-side telemetry fallbacks (mapFallbackReason set) mean the real map
        // hasn't arrived from the cloud yet. Give the main poll (~30 s) enough time
        // to deliver it — up to ~2 min (24 × 5 s) — before falling through to render
        // the sparse fallback canvas. Partial geometry (wrong zone count) only waits
        // 4 × 5 s as before.
        var maxWaits = data.mapFallbackReason ? 1 : 4;
        if (_initialGeometryWaits <= maxWaits) {
          showMsg((navigator.language || '').toLowerCase().startsWith('de') ? 'Gartenkarte wird geladen …' : 'Loading garden map …');
          return;
        }
      }
      if (!data || !data.boundary) {
        if (_lastFullMapData) { _lastData = _lastFullMapData; renderMap(); return; }
        showMsg((navigator.language || '').toLowerCase().startsWith('de') ? 'Noch keine Kartendaten verfügbar – bitte Karte aktualisieren.' : 'No map data available yet — refresh the map.');
        return;
      }
      if (hasFullGardenGeometry(data)) {
        _initialGeometryWaits = 0;
        _lastFullMapData = data;
        _lastData = data;
      } else if (_lastFullMapData) {
        _lastData = mergeLiveMapData(_lastFullMapData, data);
        _lastFullMapData = _lastData;
      } else {
        _lastData = data;
      }
      // Edit is available for garage markers and/or detected obstacle pylons.
      var displayData = _lastData || data;
      var garageActive = !!(displayData.overlayVisibility && displayData.overlayVisibility.garageMode);
      var hasPylons = Array.isArray(displayData.obstaclePylons) && displayData.obstaclePylons.length > 0;
      document.getElementById('edit-btn').classList.toggle('hidden', _editMode || (!garageActive && !hasPylons));
      if (!_dragMarker && !_editMode) renderMap();
    }

    function renderMap() {
      if (!_lastData) return;
      try {
        document.getElementById('map-wrap').innerHTML = buildSvg(_lastData, _settings);
        bindEditMarkers();
        const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('footer-text').textContent = _lastData.name + ' · ' + ts;
        if (false && _lastVbW > 0 && _lastVbH > 0 && _homey && _homey.setHeight) {
          var measuredW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0, 300);
          // Homey/iOS briefly reports a much smaller iframe width while the page is
          // scrolled or re-laid out. Never shrink the widget from that transient value.
          if (!_stableWidgetWidth || measuredW > _stableWidgetWidth * 1.08) _stableWidgetWidth = measuredW;
          if (!_stableWidgetHeight) {
            var footerH = document.getElementById('footer').offsetHeight || 16;
            var ratio = _lastVbH / Math.max(_lastVbW, 1);
            ratio = Math.max(0.72, Math.min(1.08, ratio));
            _stableWidgetHeight = Math.round(_stableWidgetWidth * ratio) + footerH;
            _homey.setHeight(_stableWidgetHeight);
          }
        }
      } catch (e) {
        showMsg('Render error: ' + e.message, true);
      }
    }

    // Read-only mowing pattern overlay. The recorded route is analysed as a
    // sequence of travel segments. We estimate the dominant mowing axis modulo
    // 180 degrees, then draw passes in one direction bright and the opposite
    // direction darker. Turn/connectors are left as the neutral base route.
    //
    // This is VISUAL ONLY: it never changes mower state, garage safety or route
    // data, and it deliberately does not use the mower's instantaneous heading.
    function buildMowingPatternPaths(path, tx, ty, refSize, sw, finalMode) {
      if (!Array.isArray(path) || path.length < 2) return '';

      const segments = [];
      let previous = null;
      let sumCos2 = 0;
      let sumSin2 = 0;
      let totalWeight = 0;

      const validPoint = (pt) => Array.isArray(pt) && pt.length >= 2
        && pt[0] !== 32767
        && typeof pt[0] === 'number' && typeof pt[1] === 'number'
        && Number.isFinite(pt[0]) && Number.isFinite(pt[1]);
      const median = (values) => {
        if (!values.length) return null;
        const sorted = values.slice().sort((a,b) => a-b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      };

      for (let i = 0; i < path.length; i++) {
        const pt = path[i];
        if (!validPoint(pt)) { previous = null; continue; }
        if (previous) {
          const dx = pt[0] - previous[0];
          const dy = pt[1] - previous[1];
          const length = Math.hypot(dx, dy);
          if (length > 0.001 && length <= 3000) {
            const angle = Math.atan2(dy, dx);
            const weight = Math.min(length, 3000);
            sumCos2 += Math.cos(angle * 2) * weight;
            sumSin2 += Math.sin(angle * 2) * weight;
            totalWeight += weight;
            segments.push({ a: previous, b: pt, dx, dy, length });
          }
        }
        previous = pt;
      }

      if (!segments.length || totalWeight <= 0) return '';
      const axis = Math.atan2(sumSin2, sumCos2) / 2;
      const ux = Math.cos(axis);
      const uy = Math.sin(axis);
      const crossOf = (x,y) => -x * uy + y * ux;
      const alongOf = (x,y) => x * ux + y * uy;
      const aligned = segments.map(seg => ({
        seg,
        along: Math.abs(seg.dx * ux + seg.dy * uy),
        across: Math.abs(-seg.dx * uy + seg.dy * ux),
        cross: crossOf((seg.a[0]+seg.b[0])/2, (seg.a[1]+seg.b[1])/2),
      })).filter(x => x.along / x.seg.length >= 0.70);
      if (!aligned.length) return '';

      // Infer the lane pitch from true cross-axis connectors and, for a final
      // completed-job render, also from the stable centres of parallel passes.
      const connectorSpacings = segments.map(seg => ({
        seg,
        along: Math.abs(seg.dx * ux + seg.dy * uy),
        across: Math.abs(-seg.dx * uy + seg.dy * ux),
      })).filter(x => x.along / x.seg.length < 0.35 && x.across >= 120 && x.across <= 800)
        .map(x => x.across);

      const crossValues = aligned.filter(x => x.seg.length >= 80).map(x => x.cross).sort((a,b)=>a-b);
      const clusters = [];
      for (const value of crossValues) {
        const last = clusters[clusters.length - 1];
        if (!last || Math.abs(value - last.mean) > 95) clusters.push({sum:value,count:1,mean:value});
        else { last.sum += value; last.count += 1; last.mean = last.sum / last.count; }
      }
      const centreSpacings = [];
      for (let i=1;i<clusters.length;i++) {
        const d = clusters[i].mean - clusters[i-1].mean;
        if (d >= 120 && d <= 800) centreSpacings.push(d);
      }
      const inferredPitch = median(connectorSpacings.length ? connectorSpacings : centreSpacings) || 250;
      const lanePitch = Math.max(120, Math.min(800, inferredPitch));
      const bandWidth = lanePitch * (finalMode ? 0.86 : 0.96);
      const laneOrigin = clusters.length ? clusters[0].mean
        : aligned.reduce((m,x)=>Math.min(m,x.cross), Infinity);
      const coord = (n) => Number(n).toFixed(1);
      let light = '';
      let dark = '';

      if (finalMode) {
        // Completed jobs are re-rendered from lane geometry instead of replaying
        // every GPS/M_PATH segment. Retraced pieces and little steering wiggles
        // collapse into one clean lane, while larger gaps remain gaps. This is
        // presentation-only and never changes the mower route or coverage data.
        const lanes = new Map();
        for (const item of aligned) {
          if (item.seg.length < 45) continue;
          const laneIndex = Math.round((item.cross - laneOrigin) / lanePitch);
          const a = alongOf(item.seg.a[0], item.seg.a[1]);
          const b = alongOf(item.seg.b[0], item.seg.b[1]);
          const lo = Math.min(a,b), hi = Math.max(a,b);
          if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi-lo < 20) continue;
          let lane = lanes.get(laneIndex);
          if (!lane) { lane={intervals:[],crossSum:0,weight:0}; lanes.set(laneIndex,lane); }
          lane.intervals.push([lo,hi]);
          lane.crossSum += item.cross * item.seg.length;
          lane.weight += item.seg.length;
        }

        const maxMergeGap = Math.max(650, lanePitch * 2.25);
        for (const [laneIndex,lane] of Array.from(lanes.entries()).sort((a,b)=>a[0]-b[0])) {
          if (!lane.intervals.length) continue;
          lane.intervals.sort((a,b)=>a[0]-b[0]);
          const merged=[];
          for (const interval of lane.intervals) {
            const last=merged[merged.length-1];
            if (!last || interval[0] - last[1] > maxMergeGap) merged.push(interval.slice());
            else last[1]=Math.max(last[1],interval[1]);
          }
          const observedCross = lane.weight ? lane.crossSum/lane.weight : laneOrigin + laneIndex*lanePitch;
          // Snap mostly to the inferred lane grid, but retain a little measured
          // offset so slightly curved lawns do not look artificially displaced.
          const regularCross = laneOrigin + laneIndex*lanePitch;
          const laneCross = regularCross*0.78 + observedCross*0.22;
          for (const interval of merged) {
            if (interval[1]-interval[0] < 120) continue;
            const x1 = interval[0]*ux - laneCross*uy;
            const y1 = interval[0]*uy + laneCross*ux;
            const x2 = interval[1]*ux - laneCross*uy;
            const y2 = interval[1]*uy + laneCross*ux;
            const sx1=tx(x1), sy1=ty(y1), sx2=tx(x2), sy2=ty(y2);
            if (![sx1,sy1,sx2,sy2].every(Number.isFinite)) continue;
            const cmd='M'+coord(sx1)+','+coord(sy1)+'L'+coord(sx2)+','+coord(sy2);
            if (Math.abs(laneIndex)%2===0) light+=cmd; else dark+=cmd;
          }
        }
      } else {
        // Live view: keep real travelled geometry, but lane colour is anchored to
        // cross-axis position so a brief correction cannot flip the stripe.
        for (const item of aligned) {
          const seg=item.seg;
          const x1=tx(seg.a[0]), y1=ty(seg.a[1]), x2=tx(seg.b[0]), y2=ty(seg.b[1]);
          if (![x1,y1,x2,y2].every(Number.isFinite)) continue;
          const laneIndex=Math.round((item.cross-laneOrigin)/lanePitch);
          const cmd='M'+coord(x1)+','+coord(y1)+'L'+coord(x2)+','+coord(y2);
          if (Math.abs(laneIndex)%2===0) light+=cmd; else dark+=cmd;
        }
      }

      if (!light && !dark) return '';
      const cap = finalMode ? 'butt' : 'round';
      let svg='';
      if (dark) svg += '<path class="mowing-pattern-dark" d="'+dark
        +'" fill="none" stroke="rgba(80,137,73,0.90)" stroke-width="'+bandWidth.toFixed(2)
        +'" stroke-linecap="'+cap+'" stroke-linejoin="round" pointer-events="none"/>';
      if (light) svg += '<path class="mowing-pattern-light" d="'+light
        +'" fill="none" stroke="rgba(164,205,137,0.90)" stroke-width="'+bandWidth.toFixed(2)
        +'" stroke-linecap="'+cap+'" stroke-linejoin="round" pointer-events="none"/>';
      return svg;
    }

    // ── SVG builder ──────────────────────────────────────────────────────────

    function buildSvg(data, s) {
      s = s || {};
      var showZones      = s.show_zones      !== false;
      var showForbidden  = s.show_forbidden  !== false;
      var showSpots      = s.show_spots      !== false;
      var showContours   = false;
      var showPath       = s.show_path !== false && (!data.overlayVisibility || data.overlayVisibility.showRoute !== false);
      var showRobot      = s.show_robot !== false && (!data.overlayVisibility || data.overlayVisibility.showRobot !== false);
      var showDirection = s.show_direction !== false && (!data.overlayVisibility || data.overlayVisibility.showDirection !== false);
      var showMaintenancePoint = s.show_maintenance_point !== false && (!data.overlayVisibility || data.overlayVisibility.showMaintenancePoint !== false);
      var showObstacles  = s.show_obstacles !== false;
      // RC52: normalise every known persisted marker representation before
      // deciding visibility. Some Homey/store combinations return JSON strings;
      // older widget caches may expose the points as top-level aliases.
      function normPoint(v) {
        if (!v) return null;
        if (typeof v === 'string') {
          try { v = JSON.parse(v); } catch (e) {
            var m = v.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;| ]\s*(-?\d+(?:\.\d+)?)\s*$/);
            return m ? { x: Number(m[1]), y: Number(m[2]) } : null;
          }
        }
        if (Array.isArray(v) && isFinite(Number(v[0])) && isFinite(Number(v[1]))) return { x: Number(v[0]), y: Number(v[1]) };
        if (typeof v === 'object' && isFinite(Number(v.x)) && isFinite(Number(v.y))) return { x: Number(v.x), y: Number(v.y) };
        return null;
      }
      if (!data.garageOverlay || typeof data.garageOverlay !== 'object') data.garageOverlay = {};
